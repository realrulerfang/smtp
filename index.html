<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой сайт</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* Внешний контейнер = весь экран, без полос */
  .viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* Холст фиксированного размера 1280x720 —
     всё внутри него позиционируется в реальных пикселях макета,
     а сам холст масштабируется на весь экран через JS (аналог background-size:cover) */
  .canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    /* scale подставляется скриптом ниже */
  }

  .layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    object-fit: cover;
  }

  #bg2 {
    opacity: 0;
    animation: flashBg 15.2s linear infinite;
  }

  /* Персонаж — точные координаты и размер как в макете (800x600) */
  .character {
    position: absolute;
    left: 384px;  /* 20% от 1920 */
    top: 195px;   /* 18% от 1080 */
    width: 1200px; /* сохранена пропорция макета (было 800 из 1280) */
    height: 900px; /* сохранена пропорция макета (было 600 из 720) */
    object-fit: contain;
    object-position: bottom center;
  }

  #right {
    opacity: 0;
    animation: flashRight 5s linear infinite;
  }

  #blink {
    opacity: 0;
    animation: flashBlink 3s linear infinite;
  }

  @keyframes flashBg {
    0%      { opacity: 0; }
    98.68%  { opacity: 0; }
    98.69%  { opacity: 1; }
    100%    { opacity: 1; }
  }

  @keyframes flashRight {
    0%    { opacity: 0; }
    96%   { opacity: 0; }
    96.1% { opacity: 1; }
    100%  { opacity: 1; }
  }

  @keyframes flashBlink {
    0%       { opacity: 0; }
    96.67%   { opacity: 0; }
    96.8%    { opacity: 1; }
    100%     { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="viewport">
    <div class="canvas" id="canvas">
      <img id="bg1" class="layer" src="background1.png" alt="">
      <img id="bg2" class="layer" src="background2.jpg" alt="">

      <img id="pen"   class="character" src="pen.png"   alt="">
      <img id="right" class="character" src="right.png" alt="">
      <img id="blink" class="character" src="blink.png" alt="">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    function fitCanvas() {
      const scale = Math.max(
        window.innerWidth / 1920,
        window.innerHeight / 1080
      );
      canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();
  </script>
</body>
</html>
