<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой сайт</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* ФОН — просто тянется на весь экран (cover), никакого JS не нужно,
     всегда без полос по бокам, как было изначально */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #bg2 {
    opacity: 0;
    animation: flashBg 15.2s linear infinite;
  }

  /* ПЕРСОНАЖ — отдельный слой поверх фона, сам вписывается целиком (contain),
     поэтому никогда не обрезается. У его PNG прозрачный фон, так что
     свободное место вокруг него не закрашивается, а сквозь него виден
     настоящий фон сайта (без вставок/полос). */
  .char-canvas {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    pointer-events: none;
    /* scale подставляется скриптом ниже */
  }

  .character {
    position: absolute;
    left: 384px;   /* 20% от 1920 */
    top: 195px;    /* 18% от 1080 */
    width: 1200px;
    height: 900px;
    object-fit: contain;
    object-position: bottom center;
  }

  #right {
    opacity: 0;
    animation: flashRight 5s linear infinite;
  }

  #blink {
    opacity: 0;
    animation: flashBlink 3s linear infinite;
  }

  @keyframes flashBg {
    0%      { opacity: 0; }
    98.68%  { opacity: 0; }
    98.69%  { opacity: 1; }
    100%    { opacity: 1; }
  }

  @keyframes flashRight {
    0%    { opacity: 0; }
    96%   { opacity: 0; }
    96.1% { opacity: 1; }
    100%  { opacity: 1; }
  }

  @keyframes flashBlink {
    0%       { opacity: 0; }
    96.67%   { opacity: 0; }
    96.8%    { opacity: 1; }
    100%     { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="viewport">
    <img id="bg1" class="bg" src="background1.png" alt="">
    <img id="bg2" class="bg" src="background2.jpg" alt="">

    <div class="char-canvas" id="charCanvas">
      <img id="pen"   class="character" src="pen.png"   alt="">
      <img id="right" class="character" src="right.png" alt="">
      <img id="blink" class="character" src="blink.png" alt="">
    </div>
  </div>

  <script>
    const charCanvas = document.getElementById('charCanvas');
    function fitChar() {
      // Math.min = "вписать целиком" — персонаж никогда не обрезается
      const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
      );
      charCanvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', fitChar);
    fitChar();
  </script>
</body>
</html>
