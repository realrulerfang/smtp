<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой сайт</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  #bg1 {
    background-image: url("background1.png");
    z-index: 1;
  }

  #bg2 {
    background-image: url("background2.jpg");
    z-index: 2;
    opacity: 0;
    animation: flash 15.2s linear infinite;
  }

  /* Цикл 15.2с: bg2 невидим 15с, виден 0.2с */
  @keyframes flash {
    0%     { opacity: 0; }
    98.68% { opacity: 0; }
    98.69% { opacity: 1; }
    100%   { opacity: 1; }
  }
</style>
</head>
<body>
  <div id="bg1" class="bg"></div>
  <div id="bg2" class="bg"></div>
</body>
</html>
